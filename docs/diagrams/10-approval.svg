<svg xmlns="http://www.w3.org/2000/svg" width="980" height="280" viewBox="0 0 980 280" role="img">
<title>Approval path</title>
<rect width="980" height="280" fill="#f8fafc"/>
<defs>
  <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon points="0 0, 10 4, 0 8" fill="#0f172a"/>
  </marker>
</defs>

<rect x="20" y="40" width="170" height="64" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.75"/>
<text x="105.0" y="65.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#0f172a">Employee</text>
<text x="105.0" y="86.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">asks for a change</text>
<rect x="230" y="40" width="180" height="64" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.75"/>
<text x="320.0" y="65.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#0f172a">Proposal</text>
<text x="320.0" y="86.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">does not execute</text>
<rect x="450" y="40" width="180" height="64" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.75"/>
<text x="540.0" y="65.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#0f172a">Self-approve</text>
<text x="540.0" y="86.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">HTTP 403</text>
<rect x="230" y="170" width="180" height="64" rx="10" fill="#f0fdf4" stroke="#047857" stroke-width="1.75"/>
<text x="320.0" y="195.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#0f172a">IT engineer</text>
<text x="320.0" y="216.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">approves</text>
<rect x="450" y="170" width="200" height="64" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.75"/>
<text x="550.0" y="195.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#0f172a">Execute</text>
<text x="550.0" y="216.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">or 409 if non-compliant</text>
<rect x="700" y="170" width="240" height="64" rx="10" fill="#f0fdf4" stroke="#047857" stroke-width="1.75"/>
<text x="820.0" y="195.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#0f172a">Mock API writes</text>
<text x="820.0" y="216.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">the change</text>
<line x1="190" y1="72" x2="230" y2="72" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="410" y1="72" x2="450" y2="72" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="320" y1="104" x2="320" y2="170" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="410" y1="202" x2="450" y2="202" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="650" y1="202" x2="700" y2="202" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
