<line x1="320" y1="546" x2="400" y2="546" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="640" y1="546" x2="660" y2="546" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="520" y1="418" x2="320" y2="418" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="330" y="408" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">needs a person</text>
