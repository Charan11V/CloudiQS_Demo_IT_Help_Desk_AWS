<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" role="img">
<title>Which brain runs</title>
<rect width="860" height="640" fill="#f8fafc"/>
<defs>
  <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon points="0 0, 10 4, 0 8" fill="#0f172a"/>
  </marker>
</defs>

<rect x="300" y="20" width="260" height="56" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.75"/>
<text x="430.0" y="41.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#0f172a">run_agent</text>
<text x="430.0" y="62.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">new user message</text>
<polygon points="430,105.0 570.0,150 430,195.0 290.0,150" fill="#fff7ed" stroke="#c2410c" stroke-width="1.75"/><text x="430" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="650" fill="#0f172a">AgentCore on?</text>
<line x1="430" y1="76" x2="430" y2="105" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="250" width="240" height="64" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.75"/>
<text x="160.0" y="275.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#0f172a">Invoke Runtime</text>
<text x="160.0" y="296.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">Hyderabad</text>
<rect x="560" y="250" width="260" height="64" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.75"/>
<text x="690.0" y="275.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#0f172a">Local provider</text>
<text x="690.0" y="296.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">inside agent-api</text>
<line x1="330" y1="180" x2="160" y2="250" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="530" y1="180" x2="690" y2="250" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="168" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">yes</text>
<text x="560" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">no</text>
<polygon points="160,360.0 280.0,400 160,440.0 40.0,400" fill="#fff7ed" stroke="#c2410c" stroke-width="1.75"/><text x="160" y="405" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="650" fill="#0f172a">Transport error?</text>
<line x1="160" y1="314" x2="160" y2="360" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="40" y="520" width="220" height="64" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.75"/>
<text x="150.0" y="545.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#0f172a">Try local provider</text>
<text x="150.0" y="566.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">Groq or simulator</text>
<rect x="300" y="520" width="240" height="64" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.75"/>
<text x="420.0" y="545.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#0f172a">Keep the error</text>
<text x="420.0" y="566.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">do not switch path</text>
<line x1="80" y1="430" x2="150" y2="520" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="240" y1="430" x2="420" y2="520" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="70" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">yes</text>
<text x="250" y="480" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">no</text>
<rect x="560" y="400" width="260" height="150" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.75"/>
<text x="690.0" y="468.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#0f172a">simulator</text>
<text x="690.0" y="489.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">or Bedrock, Groq, Ollama</text>
<line x1="690" y1="314" x2="690" y2="400" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ah)"/>
</svg>
