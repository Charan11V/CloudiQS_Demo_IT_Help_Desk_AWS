<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" role="img">
<title>Local Docker path</title>
<rect width="860" height="280" fill="#f8fafc"/>
<defs>
  <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon points="0 0, 10 4, 0 8" fill="#0f172a"/>
  </marker>
</defs>

<rect x="30" y="90" width="160" height="64" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.75"/>
<text x="110.0" y="115.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#0f172a">Browser</text>
<text x="110.0" y="136.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">localhost:3000</text>
<rect x="250" y="90" width="160" height="64" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.75"/>
<text x="330.0" y="115.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#0f172a">Next.js</text>
<text x="330.0" y="136.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">rewrites</text>
<rect x="470" y="90" width="170" height="64" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.75"/>
<text x="555.0" y="115.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#0f172a">agent-api</text>
<text x="555.0" y="136.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">simulator or Groq</text>
<rect x="690" y="90" width="140" height="64" rx="10" fill="#f0fdf4" stroke="#047857" stroke-width="1.75"/>
<text x="760.0" y="115.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" fill="#0f172a">mock API</text>
<text x="760.0" y="136.0" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#475569">SQLite</text>
<line x1="190" y1="122" x2="250" y2="122" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="410" y1="122" x2="470" y2="122" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="640" y1="122" x2="690" y2="122" stroke="#0f172a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="250" y="50" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">AgentCore is off unless AGENTCORE_ENABLED=1</text>
</svg>
