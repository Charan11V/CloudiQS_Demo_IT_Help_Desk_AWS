[project]
name = "helio-agentcore-runtime"
version = "1.0.0"
description = "HELIO Strands agent for Amazon Bedrock AgentCore Runtime (GPT-OSS-20B via Groq)"
requires-python = ">=3.11"
dependencies = [
  "bedrock-agentcore>=0.1.0,<1",
  "strands-agents[openai]>=1.0,<2",
  "openai>=1.40,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "boto3>=1.39.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.uv]
package = false
